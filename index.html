<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://fav.farm/💌" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdf2f8" />
    <meta
      name="description"
      content="Bảng giá tài khoản Premium cute dành cho học sinh, sinh viên."
    />
    <title>Studytimeless Premium Shop</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pastelPink: '#fce7f3',
              pastelPinkDark: '#fbcfe8',
              pastelBlue: '#e0f2fe',
              pastelBlueDark: '#bae6fd',
              primary: '#db2777', // pink-600
              secondary: '#0ea5e9', // sky-500
            },
            fontFamily: {
              cute: ['"Patrick Hand"', 'cursive', 'sans-serif'],
              body: ['"Quicksand"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Google Fonts: Patrick Hand (Headings) & Quicksand (Body) -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #fdf2f8; /* pink-50 */
        background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
        background-size: 20px 20px;
        /* Đã xóa overflow: hidden để admin dashboard hiển thị bình thường */
        height: 100vh;
      }
      h1, h2, h3, h4, h5, h6, .font-cute {
        font-family: 'Patrick Hand', cursive;
      }
      
      /* Custom Cute Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.5);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #fbcfe8; /* pastelPinkDark */
        border-radius: 20px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #db2777; /* primary */
      }

      /* Hide Scrollbar Class */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.1",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Kết nối file Entry Point cho Vite -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
