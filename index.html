<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://fav.farm/💌" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbcfe8" />
    <meta
      name="description"
      content="Bảng giá tài khoản Premium Studytimeless."
    />
    <!-- Dòng mô tả này là dòng chữ mờ hiện dưới tiêu đề khi gửi
         link qua Zalo/Messenger/Facebook: các app đó không chạy
         code web mà chỉ đọc thẻ meta của trang. Web là trang đơn
         (HashRouter) nên mọi link, kể cả link shop phụ, đều đọc
         chung 1 mô tả này — không tách riêng từng shop được. -->
    <meta property="og:title" content="Studytimeless Premium Shop" />
    <meta property="og:description" content="Bảng giá tài khoản Premium Studytimeless." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.shoptimeless.io.vn/" />
    <title>Studytimeless Premium Shop</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pastelPink: '#fce7f3',
              pastelPinkDark: '#fbcfe8',
              pastelBlue: '#e0f2fe',
              pastelBlueDark: '#bae6fd',
              primary: '#db2777', // pink-600, giữ nguyên để không lệch với các nút hover:bg-pink-600 có sẵn trong code
              secondary: '#0ea5e9', // sky-500
              auroraViolet: '#a78bfa',
              auroraSky: '#7dd3fc',
              auroraMint: '#6ee7b7',
              auroraAmber: '#fcd34d',
            },
            fontFamily: {
              cute: ['"Patrick Hand"', 'cursive', 'sans-serif'],
              body: ['"Quicksand"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Google Fonts: Patrick Hand (Headings) & Quicksand (Body) — font gốc của file đầu -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Quicksand', sans-serif;
        /* Nền TRẢ VỀ BẢN CŨ (bản beauty đầu, file index.html bạn
           gửi lại): gradient hồng pastel chuyển nhẹ sang tím, xanh
           dương, xanh lá, phủ chấm bi mờ. Bản aurora trung tính
           mới thử đã bỏ vì bạn thấy nền cũ này đẹp hơn. Các phần
           khác của bản mới (khung bảng, icon, font) vẫn giữ nguyên,
           chỉ riêng nền là trả về cũ. */
        background-color: #fdf2f8;
        background-image:
          radial-gradient(#fbcfe8 1.2px, transparent 1.2px),
          linear-gradient(180deg, #fff1f2 0%, #fdf2f8 28%, #eef2ff 58%, #ecfeff 82%, #f0fdf4 100%);
        background-size: 22px 22px, 100% 100%;
        background-attachment: scroll, fixed;
        /* Đã xóa overflow: hidden để admin dashboard hiển thị bình thường */
        height: 100vh;
      }
      h1, h2, h3, h4, h5, h6, .font-cute {
        font-family: 'Patrick Hand', cursive;
      }

      /* Nút/bảng màu chính chuyển sang gradient chàm - tím - hồng
         đậm, sang và chuyên nghiệp hơn hồng phẳng cũ. Chỉ áp cho
         class bg-primary thuần (không áp cho bg-primary/10 dạng
         nhạt), nên các badge nhạt trong web không bị ảnh hưởng. */
      .bg-primary {
        background-image: linear-gradient(135deg, #6366f1 0%, #a855f7 48%, #ec4899 100%);
      }

      /* Bóng mềm cho thẻ trắng, nhìn nổi khỏi nền gradient hơn. */
      .shadow-xl {
        box-shadow: 0 24px 50px -24px rgba(15, 23, 42, 0.28), 0 8px 20px -12px rgba(99, 102, 241, 0.22);
      }

      ::selection {
        background: #ddd6fe;
        color: #1e1b4b;
      }

      /* Custom Cute Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.5);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #c7d2fe;
        border-radius: 20px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #6366f1; /* indigo */
      }

      /* Hide Scrollbar Class */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }

      /* Cánh hoa đào rơi (dùng bởi components/FallingEffect.tsx),
         copy đúng kiểu bên web confession (cfstimeless):
         1 cánh đào đơn vẽ bằng CSS, gradient hồng, bo tròn kiểu
         cánh hoa, có highlight trắng ở giữa, rơi chậm, bay lượn
         qua lại và xoay nhẹ. Lớp này z-index 1, nằm SAU nội dung
         nên hoa chỉ rơi ở nền, không đè lên chữ như bản emoji cũ. */
      .shop-petal-rain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }
      .shop-petal {
        position: absolute;
        top: -24px;
        background: linear-gradient(135deg, #ffe3ef 0%, #ffb3d4 55%, #ff8fbf 100%);
        border-radius: 100% 4% 100% 4%;
        opacity: 0;
        animation: shop-petal-fall linear infinite;
        filter: drop-shadow(0 2px 3px rgba(219, 39, 119, 0.15));
      }
      .shop-petal::after {
        content: '';
        position: absolute;
        inset: 2px 4px;
        background: rgba(255, 255, 255, 0.35);
        border-radius: 100% 4% 100% 4%;
      }
      @keyframes shop-petal-fall {
        0% {
          transform: translateY(-20px) translateX(0) rotate(0deg);
          opacity: 0;
        }
        8% { opacity: 0.92; }
        50% {
          transform: translateY(50vh) translateX(30px) rotate(170deg);
          opacity: 0.88;
        }
        100% {
          transform: translateY(108vh) translateX(-22px) rotate(350deg);
          opacity: 0;
        }
      }

      /* Người dùng bật "giảm chuyển động" thì tắt hẳn hiệu ứng rơi,
         trang vẫn hiện đầy đủ nội dung, không bị mờ hay mất chữ. */
      @media (prefers-reduced-motion: reduce) {
        .shop-petal-rain {
          display: none;
        }
        .animate-fade-in {
          animation: none;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.1",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Kết nối file Entry Point cho Vite -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
